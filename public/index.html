<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="robots" content="noindex, nofollow" />
  <title>Client Galleries</title>
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background: #0f1115;
      color: #e8eaed;
      text-align: center;
      padding: 24px;
    }
    .box { max-width: 520px; }
    h1 { font-weight: 600; }
    code { background: #171a20; padding: 2px 6px; border-radius: 6px; color: #7cb0ff; }
    p { color: #9aa0a6; line-height: 1.6; }
  </style>
</head>
<body>
  <div class="box">
    <h1>Client Galleries</h1>
    <p>
      Galleries are private. Open your gallery using the personalised link
      supplied to you and sign in with your password, for example:
    </p>
    <p><code>/galleries/your-client-name</code></p>
  </div>
</body>
</html>
