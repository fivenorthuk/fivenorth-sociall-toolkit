# Netlify configuration for the client gallery system.

[build]
  # No build step is required for the galleries themselves. We only need
  # dependencies (sharp) installed so the function can generate thumbnails.
  command = "echo 'No build step required'"
  publish = "public"
  functions = "netlify/functions"

[functions]
  # Bundle the raw gallery images alongside the function so it can read them
  # at runtime. Without this, the galleries/ folder is not shipped with the
  # deployed function and image lookups would fail.
  included_files = ["galleries/**"]
  # sharp ships prebuilt native binaries; mark it external so the bundler
  # does not try to inline it.
  external_node_modules = ["sharp"]

# Pretty URL: /galleries/<client-name>[/<file>]?token=... is handled by the
# function. The path segments are forwarded to the function via the splat and
# parsed there (Netlify does not substitute :placeholders inside a destination
# query string, so we route on the path, not on query params). The original
# query string (?token=abc-123&mode=...) is preserved automatically.
[[redirects]]
  from = "/galleries/*"
  to = "/.netlify/functions/gallery/:splat"
  status = 200
  force = true
